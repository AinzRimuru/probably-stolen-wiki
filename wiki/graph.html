<script>
"use strict";
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
/* ================= data ================= */
const DATA = window.GRAPH_DATA;
const SYS = {}; DATA.meta.systems.forEach(s => SYS[s.id] = s);
const nodesById = {};
const N = [], L = [];
const PROC = [];

for (const n of DATA.nodes) {
  n.x = 0; n.y = 0; n.vx = 0; n.vy = 0; n.fx = null; n.fy = null;
  n.visible = true; n.alpha = 0; n.degree = 0;
  nodesById[n.id] = n; N.push(n);
}
for (const p of DATA.processes) {
  p.type = "process"; p.x = 0; p.y = 0; p.vx = 0; p.vy = 0; p.fx = null; p.fy = null;
  p.visible = true; p.alpha = 0; p.degree = 0;
  p.color = SYS[p.system].color;
  nodesById[p.id] = p; N.push(p); PROC.push(p);
}
for (const l of DATA.links) {
  const link = { s: nodesById[l.s], t: nodesById[l.t], sys: null, curve: 0 };
  link.sys = link.s.type === "process" ? link.s.system : (link.t.type === "process" ? link.t.system : "misc-machines");
  link.color = SYS[link.sys].color;
  link.curve = ((l.s.length + l.t.length) % 7 - 3) * 0.06;
  link.particles = []; link.flow = Math.random();
  L.push(link); link.s.degree++; link.t.degree++;
}

/* neighbor indexes */
const outLinks = {}, inLinks = {};
for (const l of L) {
  (outLinks[l.s.id] = outLinks[l.s.id] || []).push(l);
  (inLinks[l.t.id] = inLinks[l.t.id] || []).push(l);
}

/* ================= icons ================= */
const icons = {};
let iconsToLoad = 0;
for (const n of N) {
  if (n.icon) {
    const img = new Image();
    img.src = "assets/icons/" + n.icon;
    iconsToLoad++;
    img.onload = () => { n.iconReady = true; };
    img.onerror = () => { n.iconReady = false; };
    icons[n.id] = img;
  }
}

/* ================= canvas ================= */
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");
let W = 0, H = 0, DPR = Math.min(devicePixelRatio || 1, 2);
function resize() {
  W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
addEventListener("resize", resize); resize();

/* camera */
const cam = { x: 0, y: 0, zoom: 0.8, tzoom: 0.8, tx: 0, ty: 0 };
function w2s(x, y) { return { x: (x - cam.x) * cam.zoom + W / 2, y: (y - cam.y) * cam.zoom + H / 2 }; }
function s2w(x, y) { return { x: (x - W / 2) / cam.zoom + cam.x, y: (y - H / 2) / cam.zoom + cam.y }; }

/* ================= layout ================= */
const WORLD_W = 3000;
function initPositions() {
  for (const n of N) {
    n.x = 400 + (n.rank01 || 0) * (WORLD_W - 800) + (Math.random() - 0.5) * 160;
    n.y = (Math.random() - 0.5) * 2300;
  }
}
initPositions();

let simAlpha = 1;
function simulate() {
  simAlpha *= 0.995; if (simAlpha < 0.03) simAlpha = 0.03;
  const a = simAlpha;
  // repulsion
  for (let i = 0; i < N.length; i++) {
    const ni = N[i]; if (!ni.visible) continue;
    for (let j = i + 1; j < N.length; j++) {
      const nj = N[j]; if (!nj.visible) continue;
      let dx = nj.x - ni.x, dy = nj.y - ni.y;
      let d2 = dx * dx + dy * dy; if (d2 < 1) d2 = 1;
      if (d2 > 900000) continue;
      const d = Math.sqrt(d2);
      const rep = 3400 / d2 * a;
      const fx = dx / d * rep, fy = dy / d * rep;
      ni.vx -= fx; ni.vy -= fy; nj.vx += fx; nj.vy += fy;
    }
  }
  // springs
  for (const l of L) {
    if (!l.s.visible || !l.t.visible) continue;
    const dx = l.t.x - l.s.x, dy = l.t.y - l.s.y;
    const d = Math.sqrt(dx * dx + dy * dy) || 1;
    const rest = l.s.type === "process" || l.t.type === "process" ? 150 : 185;
    const f = (d - rest) * 0.012 * a;
    const fx = dx / d * f, fy = dy / d * f;
    l.s.vx += fx; l.s.vy += fy; l.t.vx -= fx; l.t.vy -= fy;
  }
  // rank bias (left -> right flow) + gentle centering
  for (const n of N) {
    if (!n.visible) { n.vx *= .9; n.vy *= .9; continue; }
    const tx = 400 + (n.rank01 || 0) * (WORLD_W - 800);
    n.vx += (tx - n.x) * 0.011 * a;
    n.vy -= n.y * 0.0016 * a;
  }
  // integrate
  for (const n of N) {
    if (n.fx !== null) { n.x = n.fx; n.y = n.fy; n.vx = 0; n.vy = 0; continue; }
    if (n.drag) { n.x = n.dx; n.y = n.dy; continue; }
    const spd = Math.hypot(n.vx, n.vy);
    const damp = spd < 0.9 ? 0.55 : 0.82; // extra damping at low speed kills micro-jitter
    n.vx *= damp; n.vy *= damp;
    if (spd < 0.05) { n.vx = 0; n.vy = 0; }
    n.x += n.vx; n.y += n.vy;
    // fade in
    if (n.spawnT !== undefined && performance.now() > n.spawnT) n.alpha = Math.min(1, n.alpha + 0.04);
  }
  // collision: keep icons & labels from overlapping (positional resolve, 2 passes)
  for (let iter = 0; iter < 2; iter++) {
    for (let i = 0; i < N.length; i++) {
      const ni = N[i]; if (!ni.visible) continue;
      for (let j = i + 1; j < N.length; j++) {
        const nj = N[j]; if (!nj.visible) continue;
        let dx = nj.x - ni.x, dy = nj.y - ni.y;
        const min = collideR(ni) + collideR(nj);
        let d2 = dx * dx + dy * dy;
        if (d2 >= min * min) continue;
        if (d2 < 0.01) { dx = (i % 7 + 1) * 0.3; dy = (j % 5 + 1) * 0.3; d2 = dx * dx + dy * dy; }
        const d = Math.sqrt(d2);
        const push = (min - d) * 0.3;
        const ux = dx / d, uy = dy / d;
        if (!ni.drag) { ni.x -= ux * push; ni.y -= uy * push; }
        if (!nj.drag) { nj.x += ux * push; nj.y += uy * push; }
      }
    }
  }
}

/* ================= visibility & filters ================= */
const sysOn = {}; for (const s of DATA.meta.systems) sysOn[s.id] = true;
let hubMode = false;

function recomputeVisibility() {
  for (const p of PROC) p.visible = sysOn[p.system];
  // items visible if linked to a visible process
  const vis = new Set();
  for (const l of L) {
    if (l.s.type === "process" ? l.s.visible : l.t.visible) {
      if (l.s.type === "process") vis.add(l.t.id); else vis.add(l.s.id);
    }
  }
  for (const n of N) if (n.type !== "process") n.visible = vis.has(n.id);
  if (hubMode) {
    const keep = new Set();
    for (const n of N) if (n.visible && n.hub) keep.add(n.id);
    for (const p of PROC) if (p.visible) {
      let touch = false;
      for (const io of p.in.concat(p.out)) if (keep.has(io.id)) touch = true;
      p.visible = touch;
    }
    for (const l of L) {
      const p = l.s.type === "process" ? l.s : l.t;
      const item = l.s.type === "process" ? l.t : l.s;
      if (p.visible && (keep.has(item.id) || true)) { /* keep edge only if item hub or proc visible */ }
    }
    const vis2 = new Set();
    for (const l of L) {
      const p = l.s.type === "process" ? l.s : l.t;
      const item = l.s.type === "process" ? l.t : l.s;
      if (p.visible && item.visible) { vis2.add(p.id); vis2.add(item.id); }
    }
    for (const n of N) if (n.visible && n.type !== "process" && !vis2.has(n.id)) {
      // keep hub items even isolated visually? drop
    }
  }
  updateStats();
}

/* ================= focus / highlight ================= */
let focusSet = null; // Set of node ids, or null
let hoverNode = null, selectedNode = null, draggingNode = null;

function upstreamOf(id, set) { for (const l of (inLinks[id] || [])) { if (!set.has(l.s.id)) { set.add(l.s.id); upstreamOf(l.s.id, set); } } return set; }
function downstreamOf(id, set) { for (const l of (outLinks[id] || [])) { if (!set.has(l.t.id)) { set.add(l.t.id); downstreamOf(l.t.id, set); } } return set; }

function focusChain(node) {
  const set = new Set([node.id]);
  upstreamOf(node.id, set); downstreamOf(node.id, set);
  focusSet = set;
  fitCameraTo(set);
}
function clearFocus() { focusSet = null; }

function fitCameraTo(set) {
  let minx = 1e9, miny = 1e9, maxx = -1e9, maxy = -1e9;
  for (const n of N) {
    if (!set.has(n.id)) continue;
    minx = Math.min(minx, n.x - 60); maxx = Math.max(maxx, n.x + 60);
    miny = Math.min(miny, n.y - 60); maxy = Math.max(maxy, n.y + 60);
  }
  if (minx > maxx) return;
  cam.tx = (minx + maxx) / 2; cam.ty = (miny + maxy) / 2;
  cam.tzoom = Math.min(1.6, Math.max(0.28, Math.min(W / (maxx - minx + 200), H / (maxy - miny + 260))));
}

/* ================= interactions ================= */
let mouseX = -1, mouseY = -1, mouseDown = false, downX = 0, downY = 0, moved = false, lastClick = 0, lastClickNode = null;

function nodeRadius(n) {
  if (n.type === "process") return 0; // rect
  if (n.type === "pseudo") return 20;
  if (n.type === "liquid") return 13;
  return n.hub ? 21 : 17 + Math.min(6, n.degree * 0.4);
}

/* collision radius: icon + clearance for the label below */
function collideR(n) {
  if (n.type === "process") return 64;
  return nodeRadius(n) + 24;
}
function hitTest(sx, sy) {
  const w = s2w(sx, sy);
  let best = null, bestD = 1e9;
  for (const n of N) {
    if (!n.visible || n.alpha < 0.5) continue;
    if (n.type === "process") {
      const hw = 46, hh = 20;
      if (Math.abs(w.x - n.x) < hw && Math.abs(w.y - n.y) < hh) return n;
    } else {
      const r = nodeRadius(n) + 6;
      const dx = w.x - n.x, dy = w.y - n.y;
      const d = dx * dx + dy * dy;
      if (d < r * r && d < bestD) { best = n; bestD = d; }
    }
  }
  return best;
}

cv.addEventListener("pointerdown", e => {
  mouseDown = true; moved = false; downX = e.clientX; downY = e.clientY;
  const n = hitTest(e.clientX, e.clientY);
  if (n) { draggingNode = n; n.drag = true; n.dx = n.x; n.dy = n.y; }
  cv.setPointerCapture(e.pointerId);
});
cv.addEventListener("pointermove", e => {
  mouseX = e.clientX; mouseY = e.clientY;
  if (mouseDown) {
    const dx = e.clientX - downX, dy = e.clientY - downY;
    if (Math.abs(dx) + Math.abs(dy) > 4) moved = true;
    if (draggingNode) {
      const w = s2w(e.clientX, e.clientY);
      draggingNode.dx = w.x; draggingNode.dy = w.y;
    } else {
      cam.tx -= (e.clientX - downX) / cam.zoom; cam.ty -= (e.clientY - downY) / cam.zoom;
      cam.x = cam.tx; cam.y = cam.ty;
      downX = e.clientX; downY = e.clientY;
      cv.classList.add("grabbing");
    }
  } else {
    hoverNode = hitTest(e.clientX, e.clientY);
    cv.classList.toggle("pointing", !!hoverNode);
  }
});
addEventListener("pointerup", e => {
  if (draggingNode) { delete draggingNode.drag; draggingNode = null; simAlpha = Math.max(simAlpha, .12); }
  const wasCanvas = mouseDown; // 只有起点在画布上的点击才处理
  mouseDown = false; cv.classList.remove("grabbing");
  if (!moved && wasCanvas) {
    const n = hitTest(e.clientX, e.clientY);
    const now = performance.now();
    if (n) {
      if (lastClickNode === n && now - lastClick < 350) { // dbl click
        focusChain(n); lastClickNode = null;
      } else {
        selectNode(n); lastClickNode = n; lastClick = now;
      }
    } else {
      if (now - lastClick < 350 && lastClickNode === null) { clearFocus(); }
      else { closePanel(); selectedNode = null; }
      lastClickNode = null; lastClick = now;
    }
  }
});
cv.addEventListener("wheel", e => {
  e.preventDefault();
  const f = e.deltaY < 0 ? 1.13 : 1 / 1.13;
  cam.tzoom = Math.min(3, Math.max(0.15, cam.tzoom * f));
  // zoom towards cursor
  const w = s2w(e.clientX, e.clientY);
  cam.tx = w.x - (e.clientX - W / 2) / cam.tzoom;
  cam.ty = w.y - (e.clientY - H / 2) / cam.tzoom;
  cam.x += (cam.tx - cam.x) * 0.5; cam.y += (cam.ty - cam.y) * 0.5;
}, { passive: false });

document.getElementById("zin").onclick = () => cam.tzoom = Math.min(3, cam.tzoom * 1.25);
document.getElementById("zout").onclick = () => cam.tzoom = Math.max(0.15, cam.tzoom / 1.25);
document.getElementById("zfit").onclick = () => { cam.tx = WORLD_W / 2; cam.ty = 0; cam.tzoom = 0.5; clearFocus(); };

const searchEl = document.getElementById("search");
const suggEl = document.getElementById("sugg");
let suggSel = -1;
function searchMatches(q) {
  q = q.trim().toLowerCase();
  if (!q) return [];
  const out = [];
  for (const n of N) {
    if ((n.label || "").toLowerCase().includes(q) || n.id.toLowerCase().includes(q)) out.push(n);
  }
  return out.slice(0, 30);
}
function renderSugg(list) {
  suggEl.innerHTML = "";
  suggSel = -1;
  if (!list.length) { suggEl.style.display = "none"; return; }
  for (const n of list) {
    const d = document.createElement("button");
    d.className = "sugg-item";
    const sysTag = n.type === "process" ? SYS[n.system].name : (n.systems || []).map(s => SYS[s].name).join("·");
    d.innerHTML = `<span>${n.label}</span><span class="en">${n.id} · ${sysTag}</span>`;
    d.onclick = () => { pickSearch(n); };
    suggEl.appendChild(d);
  }
  suggEl.style.display = "block";
}
function pickSearch(n) {
  searchEl.value = n.label;
  suggEl.style.display = "none";
  selectNode(n);
  cam.tx = n.x; cam.ty = n.y; cam.tzoom = Math.max(cam.tzoom, 1.1);
}
searchEl.addEventListener("input", () => renderSugg(searchMatches(searchEl.value)));
searchEl.addEventListener("keydown", e => {
  const list = [...suggEl.querySelectorAll(".sugg-item")];
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    e.preventDefault();
    suggSel += e.key === "ArrowDown" ? 1 : -1;
    suggSel = (suggSel + list.length) % list.length;
    list.forEach((el, i) => el.classList.toggle("sel", i === suggSel));
  } else if (e.key === "Enter") {
    const m = searchMatches(searchEl.value);
    if (m.length) pickSearch(m[Math.max(0, suggSel)]);
  } else if (e.key === "Escape") { suggEl.style.display = "none"; searchEl.blur(); }

/* ================= panel ================= */
const panel = document.getElementById("panel");
const panelTitle = document.getElementById("panel-title");
const panelBody = document.getElementById("panel-body");
document.getElementById("panel-close").onclick = () => { closePanel(); selectedNode = null; };

function esc(s) { return String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
function ioLine(e, dir) {
  const amt = e.amount !== undefined && e.amount !== 1 ? ` <span class="amt">×${e.amount}</span>` : "";
  const raw = e.raw_id && e.raw_id.startsWith("tag:") ? ` <span class="en" style="color:#5d6b9e">[${esc(e.raw_id)}]</span>` : "";
  return `<div class="io-row">${dir === "in" ? "" : "<span style='color:#5d6b9e'>→</span>&nbsp;"}${esc(e.name_zh || (nodesById[e.id] ? nodesById[e.id].label : e.id))}${amt}${raw}</div>`;
}
function recipeCard(p, dir) {
  const ins = p.in.map(e => `${esc(e.name_zh || (nodesById[e.id]?.label ?? e.id))}${e.amount && e.amount !== 1 ? "×" + e.amount : ""}`).join("、");
  const outs = p.out.map(e => `${esc(e.name_zh || (nodesById[e.id]?.label ?? e.id))}${e.amount && e.amount !== 1 ? "×" + e.amount : ""}`).join("、");
  return `<div class="recipe-card" data-proc="${p.id}">
    <div class="rc-head"><span class="rc-machine" style="background:${p.color}">${esc(p.machine_zh)}</span>${esc(p.name || p.label)}
      <span class="rc-time">${esc(p.time || "")}</span></div>
    <div class="rc-flow">${dir === "up" ? "产出" : "消耗"}：${ins || "—"} <span class="arrow">→</span> ${outs || "—"}</div>
  </div>`;
}
function selectNode(n) {
  selectedNode = n;
  panel.classList.add("open");
  if (n.type === "process") renderProcessPanel(n);
  else renderItemPanel(n);
}
function closePanel() { panel.classList.remove("open"); }

function sysTagHtml(color, name) { return `<span class="sys-tag" style="background:${color}22;color:${color}">${name}</span>`; }

function renderItemPanel(n) {
  let h = `<div class="p-title">`;
  if (n.icon && ICONS_B64[n.icon.replace(/\.png$/, "")]) h += `<img src="${ICONS_B64[n.icon.replace(/\.png$/, "")]}">`;
  h += `${esc(n.label)}${n.hub ? ' <span title="跨系统枢纽" style="color:var(--gold)">★</span>' : ""}</div>`;
  h += `<div class="p-sub">${n.id}${n.type === "liquid" ? " · 液体成分" : ""}${n.type === "pseudo" ? " · 泛指任意物品" : ""}</div>`;
  const tags = n.type === "process" ? [] : (n.systems || []).map(s => sysTagHtml(SYS[s].color, SYS[s].name));
  if (tags.length) h += `<div class="sys-tags">${tags.join("")}</div>`;
  if (n.value !== null && n.value !== undefined) h += `<div class="kv"><span>基准价</span><b>${n.value} 信用点</b></div>`;
  if (n.obtain && n.obtain.length) h += `<div class="sec"><h3>获取途径</h3>` + n.obtain.map(o => `<div>· ${esc(o)}</div>`).join("") + `</div>`;
  if (n.note) h += `<div class="sec"><div class="note-block">${esc(n.note)}</div></div>`;

  const ups = (inLinks[n.id] || []).map(l => l.s).filter(p => p.type === "process");
  const downs = (outLinks[n.id] || []).map(l => l.t).filter(p => p.type === "process");
  if (ups.length) {
    h += `<div class="sec"><h3>上游 · 如何获得（${ups.length}）</h3>` + ups.map(p => recipeCard(p, "up")).join("") + `</div>`;
  }
  if (downs.length) {
    h += `<div class="sec"><h3>下游 · 可以做什么（${downs.length}）</h3>` + downs.map(p => recipeCard(p, "down")).join("") + `</div>`;
  }
  if (!ups.length && !downs.length) h += `<div class="sec note-block">暂无关联配方</div>`;
  h += `<div class="sec note-block">双击此节点可高亮完整上下游产业链</div>`;
  panelTitle.innerHTML = ""; panelBody.innerHTML = h;
  bindCards();
}
function renderProcessPanel(p) {
  let h = `<div class="p-title" style="border-left:4px solid ${p.color};padding-left:10px">${esc(p.name || p.label)}</div>`;
  h += `<div class="p-sub">${esc(p.machine_zh)}（${p.machine}）· ${SYS[p.system].name}</div>`;
  h += `<div class="sys-tags">${sysTagHtml(p.color, SYS[p.system].name)}</div>`;
  h += `<div class="sec"><h3>输入</h3>` + (p.in.map(e => ioLine(e, "in")).join("") || '<div class="note-block">无（如电力直驱）</div>') + `</div>`;
  h += `<div class="sec"><h3>输出</h3>` + (p.out.map(e => ioLine(e, "out")).join("") || '<div class="note-block">—</div>') + `</div>`;
  if (p.time) h += `<div class="kv"><span>耗时</span><b>${esc(p.time)}</b></div>`;
  if (p.conditions) h += `<div class="sec"><h3>条件</h3><div class="note-block">${esc(p.conditions)}</div></div>`;
  if (p.notes) h += `<div class="sec"><h3>备注</h3><div class="note-block">${esc(p.notes)}</div></div>`;
  h += `<div class="sec"><a class="wiki-link" href="systems/${p.system}.html">查看该系统的 wiki 页面</a></div>`;
  panelTitle.innerHTML = ""; panelBody.innerHTML = h;
}
function bindCards() {
  panelBody.querySelectorAll(".recipe-card").forEach(c => {
    c.onclick = () => { const n = nodesById[c.dataset.proc]; if (n) { selectNode(n); } };
  });
}

const tip = document.getElementById("tip");
function showTip(n, sx, sy) {

  else {

  tip.style.top = Math.min(H - r.height - 10, sy + 16) + "px";
}
function hideTip() { tip.style.display = "none"; }

/* ================= render ================= */
function edgeAlpha(l) {
  let a = 0.30;
  if (focusSet) a = (focusSet.has(l.s.id) && focusSet.has(l.t.id)) ? 0.85 : 0.05;
  else if (hoverNode) {
    const adj = l.s === hoverNode || l.t === hoverNode;
    a = adj ? 0.8 : 0.08;
  }
  if (!sysOn[l.sys]) a = 0;
  return a;
}
function nodeAlpha(n) {
  let a = n.alpha;
  if (focusSet && !focusSet.has(n.id)) a *= 0.16;
  else if (hoverNode && hoverNode !== n) {
    const adj = (inLinks[n.id] || []).some(l => l.s === hoverNode) || (outLinks[n.id] || []).some(l => l.t === hoverNode) || n === hoverNode;
    if (!adj) a *= 0.3;
  }
  return a;
}

let t0 = performance.now();
function frame(now) {
  simulate();
  cam.zoom += (cam.tzoom - cam.zoom) * 0.12;
  cam.x += (cam.tx - cam.x) * 0.12; cam.y += (cam.ty - cam.y) * 0.12;

  ctx.clearRect(0, 0, W, H);
  // background
  ctx.fillStyle = "#1a0b35"; ctx.fillRect(0, 0, W, H);
  drawGrid();

  /* edges */
  for (const l of L) {
    if (!l.s.visible || !l.t.visible) continue;
    const a = edgeAlpha(l); if (a <= 0.01) continue;
    const s = w2s(l.s.x, l.s.y), t = w2s(l.t.x, l.t.y);
    const mx = (s.x + t.x) / 2, my = (s.y + t.y) / 2;
    const dx = t.x - s.x, dy = t.y - s.y;
    const len = Math.hypot(dx, dy) || 1;
    const nx = -dy / len, ny = dx / len;
    const off = len * l.curve;
    const cx = mx + nx * off, cy = my + ny * off;
    ctx.strokeStyle = l.color;
    ctx.globalAlpha = a;
    ctx.lineWidth = Math.max(0.6, 1.4 * cam.zoom);
    ctx.beginPath();
    ctx.moveTo(s.x, s.y);
    ctx.quadraticCurveTo(cx, cy, t.x, t.y);
    ctx.stroke();

    /* particles */
    if (!REDUCED) l.flow += 0.004 + Math.min(0.006, 0.002 * 1);
    if (l.flow >= 1) l.flow = 0;
    if (a > 0.2) {
      const f = l.flow;
      const px = (1 - f) * (1 - f) * s.x + 2 * (1 - f) * f * cx + f * f * t.x;
      const py = (1 - f) * (1 - f) * s.y + 2 * (1 - f) * f * cy + f * f * t.y;
      ctx.globalAlpha = Math.min(1, a * 1.6) * (0.4 + 0.6 * Math.sin(f * Math.PI));
      ctx.fillStyle = l.color;
      ctx.beginPath();
      ctx.arc(px, py, Math.max(1.2, 2.1 * cam.zoom), 0, 7);
      ctx.fill();
    }
  }
  ctx.globalAlpha = 1;

  /* nodes */
  const showLabels = cam.zoom > 0.55;
  for (const n of N) {
    if (!n.visible || n.alpha <= 0.01) continue;
    const a = nodeAlpha(n);
    if (a <= 0.02) continue;
    const p = w2s(n.x, n.y);
    if (p.x < -80 || p.x > W + 80 || p.y < -80 || p.y > H + 80) continue;

    if (n.type === "process") drawProcess(n, p, a);
    else if (n.type === "pseudo") drawPseudo(n, p, a);
    else if (n.type === "liquid") drawLiquid(n, p, a);
    else drawItem(n, p, a, now);
  }

  /* labels — priority pass with collision declutter */
  const fontSz = Math.max(10, 11.5 * Math.min(1, cam.zoom + 0.2));
  ctx.font = `${fontSz}px "Microsoft YaHei", sans-serif`;
  ctx.textAlign = "center";
  const cands = [];
  for (const n of N) {
    if (!n.visible || n.alpha <= 0.01) continue;
    if (focusSet && !focusSet.has(n.id)) continue;
    const isSel = n === selectedNode || n === hoverNode;
    let prio;
    if (isSel) prio = 0;
    else if (n.type === "process") prio = 1;
    else if (n.hub) prio = 2;
    else if (cam.zoom > 0.7) prio = 3;
    else continue;
    cands.push({ n, prio });
  }
  cands.sort((a, b) => a.prio - b.prio || b.n.degree - a.n.degree);
  const placed = [];
  for (const { n } of cands) {
    const p = w2s(n.x, n.y);
    const label = n.type === "process" ? shortProcLabel(n) : n.label;
    const tw = ctx.measureText(label).width + (n === selectedNode || n === hoverNode ? 8 : 0);
    const ly = p.y + (n.type === "process" ? 36 : nodeRadius(n) * cam.zoom + 15);
    const rect = { x: p.x - tw / 2 - 3, y: ly - 11, w: tw + 6, h: 15 };
    let clash = false;
    for (const r of placed) {
      if (rect.x < r.x + r.w && rect.x + rect.w > r.x && rect.y < r.y + r.h && rect.y + rect.h > r.y) { clash = true; break; }
    }
    if (clash) continue;
    placed.push(rect);
    const a = nodeAlpha(n);
    ctx.globalAlpha = Math.min(1, a + 0.15);
    ctx.fillStyle = "rgba(26,11,53,.85)";
    ctx.fillRect(rect.x, rect.y, rect.w, rect.h);
    ctx.fillStyle = (n === selectedNode || n === hoverNode) ? "#e8e8d8" : (n.hub ? "#d9a75a" : (n.type === "process" ? n.color : "#c4c4b0"));
    ctx.fillText(label, p.x, ly);
  }
  ctx.textAlign = "left";
  ctx.globalAlpha = 1;

  if (hoverNode && !mouseDown) {
    const p = w2s(hoverNode.x, hoverNode.y);
    showTip(hoverNode, p.x, p.y);
  } else hideTip();

  requestAnimationFrame(frame);
}

function drawGrid() {
  const step = 60 * cam.zoom;
  if (step < 18) return;
  const o = w2s(0, 0);
  ctx.strokeStyle = "#2a1550"; ctx.lineWidth = 1;
  ctx.beginPath();
  for (let x = o.x % step; x < W; x += step) { ctx.moveTo(x, 0); ctx.lineTo(x, H); }
  for (let y = o.y % step; y < H; y += step) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
  ctx.stroke();
}

function shortProcLabel(n) {
  return n.label.length > 14 ? n.label.slice(0, 13) + "…" : n.label;
}

function drawItem(n, p, a, now) {
  const r = nodeRadius(n) * cam.zoom;
  /* halo for hub */
  if (n.hub) {
    const pulse = REDUCED ? 0.75 : 0.5 + 0.5 * Math.sin(now / 700);
    ctx.globalAlpha = a * (0.35 + 0.4 * pulse);
    ctx.strokeStyle = "#d9a75a";
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(p.x, p.y, r + 5 + pulse * 3, 0, 7); ctx.stroke();
  }
  if (n === selectedNode || n === hoverNode) {
    ctx.globalAlpha = a; ctx.strokeStyle = "#e8e8d8"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(p.x, p.y, r + 3, 0, 7); ctx.stroke();
  }
  const sysColor = SYS[n.systems?.[0]]?.color || "#88948a";
  ctx.globalAlpha = a;
  /* circle bg */
  ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, 7);
  ctx.fillStyle = "#230f47"; ctx.fill();
  ctx.strokeStyle = n.hub ? "#d9a75a" : sysColor; ctx.lineWidth = 2;
  ctx.stroke();
  /* icon or char */
  if (n.icon && icons[n.id] && icons[n.id].complete && n.iconReady !== false) {
    const s = r * 1.5;
    ctx.save();
    ctx.beginPath(); ctx.arc(p.x, p.y, r - 1, 0, 7); ctx.clip();
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(icons[n.id], p.x - s / 2, p.y - s / 2, s, s);
    ctx.restore();
  } else {
    ctx.fillStyle = sysColor;
    ctx.font = `bold ${r}px sans-serif`; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(n.label[0] || "?", p.x, p.y + 1);
    ctx.textBaseline = "alphabetic";
  }
  ctx.textAlign = "left";
}

function drawProcess(n, p, a) {
  const hw = 46 * cam.zoom, hh = 20 * cam.zoom;
  ctx.globalAlpha = a;
  const sel = n === selectedNode || n === hoverNode;
  ctx.beginPath();
  roundRect(p.x - hw, p.y - hh, hw * 2, hh * 2, 6 * cam.zoom);
  ctx.fillStyle = "#230f47"; ctx.fill();
  ctx.strokeStyle = n.color; ctx.lineWidth = sel ? 2.5 : 1.6;
  ctx.stroke();
  /* machine glyph */
  ctx.fillStyle = n.color;
  ctx.font = `${12 * cam.zoom}px sans-serif`; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText("⚙", p.x, p.y);
  ctx.textBaseline = "alphabetic"; ctx.textAlign = "left";
}

function drawPseudo(n, p, a) {
  const r = nodeRadius(n) * cam.zoom;
  ctx.globalAlpha = a;
  ctx.setLineDash([4, 3]);
  ctx.beginPath();
  for (let i = 0; i < 6; i++) {
    const ang = Math.PI / 6 + i * Math.PI / 3;
    const x = p.x + Math.cos(ang) * r, y = p.y + Math.sin(ang) * r;
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  ctx.closePath();
  ctx.fillStyle = "#2c1656"; ctx.fill();
  ctx.strokeStyle = "#8397bb"; ctx.lineWidth = 1.6; ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = "#c4c4b0"; ctx.font = `bold ${10 * cam.zoom}px sans-serif`;
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText("泛", p.x, p.y);
  ctx.textBaseline = "alphabetic"; ctx.textAlign = "left";
}

function drawLiquid(n, p, a) {
  const r = nodeRadius(n) * cam.zoom;
  ctx.globalAlpha = a;
  ctx.beginPath();
  ctx.moveTo(p.x, p.y - r * 1.2);
  ctx.bezierCurveTo(p.x + r * 1.1, p.y - r * 0.2, p.x + r * 0.95, p.y + r, p.x, p.y + r);
  ctx.bezierCurveTo(p.x - r * 0.95, p.y + r, p.x - r * 1.1, p.y - r * 0.2, p.x, p.y - r * 1.2);
  ctx.fillStyle = "#2c1656"; ctx.fill();
  ctx.strokeStyle = "#429cbd"; ctx.lineWidth = 1.6; ctx.stroke();
  ctx.fillStyle = "#84bcc4"; ctx.font = `bold ${9 * cam.zoom}px sans-serif`;
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText("液", p.x, p.y + 1);
  ctx.textBaseline = "alphabetic"; ctx.textAlign = "left";
}

function roundRect(x, y, w, h, r) {
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

/* ================= boot ================= */
recomputeVisibility();
updateStats();
/* staggered spawn */
const byRank = [...N].sort((a, b) => a.rank01 - b.rank01);
byRank.forEach((n, i) => { n.alpha = 0; n.spawnT = 200 + i * 9; });

cam.x = WORLD_W / 2; cam.y = 0; cam.tx = WORLD_W / 2; cam.ty = 0; cam.zoom = 0.2; cam.tzoom = 0.5;

requestAnimationFrame(frame);
setTimeout(() => document.getElementById("loading").classList.add("hide"), 900);
</script>
